name: Build and deploy Azure

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag (defaults to commit SHA)'
        required: false
        default: ''
        type: string
      namespace:
        description: 'Kubernetes namespace'
        required: false
        default: 'app'
        type: string

permissions:
  contents: read
  id-token: write

env:
  TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
  TFC_WORKSPACE: ${{ vars.TFC_WORKSPACE }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}
  AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required variables
        run: |
          if [ -z "${TFC_ORGANIZATION}" ]; then
            echo "Error: TFC_ORGANIZATION variable is not set"
            exit 1
          fi
          if [ -z "${TFC_WORKSPACE}" ]; then
            echo "Error: TFC_WORKSPACE variable is not set"
            exit 1
          fi
          if [ -z "${AZURE_SUBSCRIPTION_ID}" ]; then
            echo "Error: AZURE_SUBSCRIPTION_ID variable is not set"
            exit 1
          fi
          if [ -z "${ACR_LOGIN_SERVER}" ]; then
            echo "Error: ACR_LOGIN_SERVER variable is not set"
            exit 1
          fi
          if [ -z "${AKS_CLUSTER_NAME}" ]; then
            echo "Error: AKS_CLUSTER_NAME variable is not set"
            exit 1
          fi
          echo "✓ Required variables are set"

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ vars.ACR_USERNAME }}
          password: ${{ vars.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure kubectl
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }}

      - name: Lint Helm chart
        run: helm lint k8s/helm/app

      - name: Deploy with Helm
        run: |
          helm upgrade --install app k8s/helm/app \
            --namespace ${{ vars.K8S_NAMESPACE || 'app' }} --create-namespace \
            --set image.repository="${{ env.ACR_LOGIN_SERVER }}" \
            --set image.tag="${{ github.sha }}" \
            --wait --atomic --timeout 5m
