name: Terraform Azure

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true
  TFC_ORGANIZATION: ${{ vars.TFC_ORGANIZATION }}
  TFC_WORKSPACE: ${{ vars.TFC_WORKSPACE }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  TF_STATE_SA: ${{ vars.TF_STATE_SA }}

jobs:
  plan-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.3.0"

      - name: Check required variables
        run: |
          if [ -z "${TFC_ORGANIZATION}" ]; then
            echo "Error: TFC_ORGANIZATION variable is not set"
            exit 1
          fi
          if [ -z "${TFC_WORKSPACE}" ]; then
            echo "Error: TFC_WORKSPACE variable is not set"
            exit 1
          fi
          echo "✓ HCP Terraform variables are set"

      - name: Configure Terraform Cloud
        run: |
          echo "token = ${{ secrets.TFC_TOKEN }}" > ~/.terraform.d/credentials.tfrc.json

      - name: Terraform init
        working-directory: infra-azure
        run: |
          terraform init \
            -backend-config="address=https://app.terraform.io/api/v2/" \
            -backend-config="organization=${TFC_ORGANIZATION}" \
            -backend-config="workspaces.name=${TFC_WORKSPACE}" \
            -backend-config="token=${{ secrets.TFC_TOKEN }}"

      - name: Terraform format and validate
        working-directory: infra-azure
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Terraform plan
        if: ${{ github.event.inputs.terraform_action == 'plan' || github.event.inputs.terraform_action == '' }}
        working-directory: infra-azure
        env:
          TF_VAR_azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          TF_VAR_github_owner: ${{ vars.GITHUB_OWNER }}
          TF_VAR_github_repository: ${{ vars.GITHUB_REPOSITORY }}
        run: |
          terraform plan -input=false

      - name: Terraform apply
        if: ${{ github.event.inputs.terraform_action == 'apply' }}
        working-directory: infra-azure
        env:
          TF_VAR_azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          TF_VAR_github_owner: ${{ vars.GITHUB_OWNER }}
          TF_VAR_github_repository: ${{ vars.GITHUB_REPOSITORY }}
        run: |
          terraform apply -auto-approve -input=false

      - name: Terraform destroy
        if: ${{ github.event.inputs.terraform_action == 'destroy' }}
        working-directory: infra-azure
        env:
          TF_VAR_azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          TF_VAR_github_owner: ${{ vars.GITHUB_OWNER }}
          TF_VAR_github_repository: ${{ vars.GITHUB_REPOSITORY }}
        run: |
          terraform destroy -auto-approve -input=false
