name: Terraform GCP

on:
  push:
    branches: [main]
    paths: ["infra-gcp/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  plan-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.3.0"

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Terraform init
        working-directory: infra-gcp
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="prefix=keyless-eks-gcp/terraform.tfstate" \
            -backend-config="project=${GCP_PROJECT_ID}" \
            -backend-config="region=us-central1" \
            -backend-config="encrypt=true"

      - name: Terraform format and validate
        working-directory: infra-gcp
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Terraform plan
        working-directory: infra-gcp
        env:
          TF_VAR_gcp_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_github_owner: ${{ vars.GITHUB_OWNER }}
          TF_VAR_github_repository: ${{ vars.GITHUB_REPOSITORY }}
        run: |
          terraform plan -out=tfplan

      - name: Terraform apply
        working-directory: infra-gcp
        env:
          TF_VAR_gcp_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_github_owner: ${{ vars.GITHUB_OWNER }}
          TF_VAR_github_repository: ${{ vars.GITHUB_REPOSITORY }}
        run: |
          terraform apply -auto-approve tfplan
