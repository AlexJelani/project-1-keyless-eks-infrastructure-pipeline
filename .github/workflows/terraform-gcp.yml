name: Terraform GCP

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true
  TF_ORGANIZATION: ${{ vars.TF_VAR_ORGANIZATION }}
  TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  plan-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.3.0"

      - name: Create Terraform directory
        run: mkdir -p "$HOME/.terraform.d"

      - name: Check required variables
        run: |
          if [ -z "${TF_ORGANIZATION}" ]; then
            echo "Error: TF_ORGANIZATION (TF_VAR_ORGANIZATION variable) is not set"
            exit 1
          fi
          if [ -z "${TF_WORKSPACE}" ]; then
            echo "Error: TF_WORKSPACE is not set"
            exit 1
          fi
          if [ -z "${GCP_PROJECT_ID}" ]; then
            echo "Error: GCP_PROJECT_ID is not set"
            exit 1
          fi
          echo "✓ HCP Terraform variables are set"
          echo "Organization: ${{ vars.TF_VAR_ORGANIZATION }}"
          echo "Workspace: ${{ vars.TF_WORKSPACE }}"

      - name: Configure Terraform Cloud
        run: |
          mkdir -p "$HOME/.terraform.d"
          echo "${{ secrets.TFC_TOKEN }}" > "$HOME/.terraform.d/token"
          echo "✓ Terraform Cloud token configured"

      - name: Terraform init
        working-directory: infra-gcp
        run: |
          terraform init

      - name: Terraform format and validate
        working-directory: infra-gcp
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Terraform plan
        if: ${{ github.event.inputs.terraform_action == 'plan' || github.event.inputs.terraform_action == '' }}
        working-directory: infra-gcp
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_github_owner: ${{ vars.GH_OWNER }}
          TF_VAR_github_repository: ${{ vars.REPOSITORY_NAME }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
        run: |
          terraform plan -input=false

      - name: Terraform apply
        if: ${{ github.event.inputs.terraform_action == 'apply' }}
        working-directory: infra-gcp
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_github_owner: ${{ vars.GH_OWNER }}
          TF_VAR_github_repository: ${{ vars.REPOSITORY_NAME }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
        run: |
          terraform apply -auto-approve -input=false

      - name: Terraform destroy
        if: ${{ github.event.inputs.terraform_action == 'destroy' }}
        working-directory: infra-gcp
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_github_owner: ${{ vars.GH_OWNER }}
          TF_VAR_github_repository: ${{ vars.REPOSITORY_NAME }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
        run: |
          terraform destroy -auto-approve -input=false
