name: Terraform GCP

on:
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}

jobs:
  plan-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.3.0"

      - name: Create Terraform directory
        run: mkdir -p "$HOME/.terraform.d"

      - name: Check required variables
        run: |
          if [ -z "${GCP_PROJECT_ID}" ]; then
            echo "Error: GCP_PROJECT_ID is not set"
            exit 1
          fi
          echo "✓ HCP Terraform variables are set"

      - name: Configure Terraform Cloud
        run: |
          mkdir -p "$HOME/.terraform.d"
          cat > "$HOME/.terraform.d/cli.tfrc" <<EOF
          credentials "app.terraform.io" {
            token = "${{ secrets.TFC_TOKEN }}"
          }
          EOF
          echo "Terraform Cloud token configured"
          echo "TF_CLI_CONFIG_FILE=$HOME/.terraform.d/cli.tfrc" >> $GITHUB_ENV
          ls -la "$HOME/.terraform.d/"

      - name: Terraform init
        working-directory: infra-gcp
        run: |
          terraform init

      - name: Terraform format and validate
        working-directory: infra-gcp
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Set GCP Credentials
        working-directory: infra-gcp
        run: |
          echo "GOOGLE_CREDENTIALS=***" >> $GITHUB_ENV
          echo "GCP credentials configured"
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Terraform plan
        if: ${{ github.event.inputs.terraform_action == 'plan' || github.event.inputs.terraform_action == '' }}
        working-directory: infra-gcp
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_github_owner: ${{ vars.GH_OWNER }}
          TF_VAR_github_repository: ${{ vars.REPOSITORY_NAME }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          terraform plan -input=false

      - name: Terraform apply
        if: ${{ github.event.inputs.terraform_action == 'apply' }}
        working-directory: infra-gcp
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_github_owner: ${{ vars.GH_OWNER }}
          TF_VAR_github_repository: ${{ vars.REPOSITORY_NAME }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          terraform apply -auto-approve -input=false

      - name: Terraform destroy
        if: ${{ github.event.inputs.terraform_action == 'destroy' }}
        working-directory: infra-gcp
        env:
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_github_owner: ${{ vars.GH_OWNER }}
          TF_VAR_github_repository: ${{ vars.REPOSITORY_NAME }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
          GOOGLE_CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        run: |
          terraform destroy -auto-approve -input=false
