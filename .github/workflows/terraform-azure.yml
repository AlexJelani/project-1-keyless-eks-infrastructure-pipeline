name: Terraform Azure

on:
  push:
    branches: [main]
    paths: ["infra-azure/**", "scripts/**"]
  workflow_dispatch:
    inputs:
      terraform_action:
        description: 'Terraform action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: true
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  TF_STATE_SA: ${{ vars.TF_STATE_SA }}
  TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}

jobs:
  plan-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">= 1.3.0"

      - name: Check required variables
        run: |
          if [ -z "${AZURE_SUBSCRIPTION_ID}" ]; then
            echo "Error: AZURE_SUBSCRIPTION_ID variable is not set"
            exit 1
          fi
          if [ -z "${AZURE_TENANT_ID}" ]; then
            echo "Error: AZURE_TENANT_ID variable is not set"
            exit 1
          fi
          if [ -z "${TF_STATE_SA}" ]; then
            echo "Error: TF_STATE_SA variable is not set"
            exit 1
          fi
          echo "✓ Required variables are set"

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        working-directory: infra-azure
        run: |
          terraform init \
            -backend-config="storage_account_name=${TF_STATE_SA}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=keyless-aks/terraform.tfstate" \
            -backend-config="resource_group_name=${TF_STATE_RG}" \
            -backend-config="subscription_id=${AZURE_SUBSCRIPTION_ID}" \
            -backend-config="tenant_id=${AZURE_TENANT_ID}"

      - name: Terraform format and validate
        working-directory: infra-azure
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Terraform plan
        if: ${{ github.event.inputs.terraform_action == 'plan' || github.event.inputs.terraform_action == '' }}
        working-directory: infra-azure
        env:
          TF_VAR_azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          TF_VAR_github_owner: ${{ vars.GITHUB_OWNER }}
          TF_VAR_github_repository: ${{ vars.GITHUB_REPOSITORY }}
        run: |
          terraform plan -out=tfplan

      - name: Terraform apply
        if: ${{ github.event.inputs.terraform_action == 'apply' }}
        working-directory: infra-azure
        env:
          TF_VAR_azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          TF_VAR_github_owner: ${{ vars.GITHUB_OWNER }}
          TF_VAR_github_repository: ${{ vars.GITHUB_REPOSITORY }}
        run: |
          terraform apply -auto-approve tfplan

      - name: Terraform destroy
        if: ${{ github.event.inputs.terraform_action == 'destroy' }}
        working-directory: infra-azure
        env:
          TF_VAR_azure_subscription_id: ${{ env.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_azure_tenant_id: ${{ env.AZURE_TENANT_ID }}
          TF_VAR_github_owner: ${{ vars.GITHUB_OWNER }}
          TF_VAR_github_repository: ${{ vars.GITHUB_REPOSITORY }}
        run: |
          terraform destroy -auto-approve
